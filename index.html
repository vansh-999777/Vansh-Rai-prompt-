<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vansh Rai - AI Photo Prompts</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b12;color:#fff}
header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252532}
.logo{font-size:24px;font-weight:800}.logo span{color:#8b5cf6}
nav a{color:#bbb;text-decoration:none;margin-left:20px}
.hero{text-align:center;padding:70px 20px 45px;background:radial-gradient(circle at top,#25134a,#0b0b12 55%)}
.hero h1{font-size:46px;margin:0 0 14px}.hero h1 span{color:#9b6cff}
.hero p{color:#b8b8c7;max-width:650px;margin:auto;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:35px 20px}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:30px}
.cat{background:#151521;border:1px solid #29293a;border-radius:14px;padding:18px;cursor:pointer;text-align:center;transition:.2s}
.cat:hover,.cat.active{border-color:#8b5cf6;background:#1c1630}.cat b{display:block;margin-top:8px}
.prompt-card{background:#151521;border:1px solid #29293a;border-radius:18px;padding:22px;margin-bottom:18px}
.prompt-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.prompt-title h3{margin:0}.tag{font-size:12px;color:#b99aff;background:#241a3b;padding:6px 9px;border-radius:20px}
.prompt{color:#c7c7d3;line-height:1.6;background:#0e0e16;padding:15px;border-radius:12px;margin:16px 0}
button{border:0;border-radius:10px;padding:11px 16px;background:#8b5cf6;color:white;font-weight:700;cursor:pointer}
button:hover{background:#7444db}.copied{background:#16a34a}
footer{text-align:center;color:#777;padding:35px;border-top:1px solid #252532;margin-top:40px}
@media(max-width:600px){.hero h1{font-size:34px}nav{display:none}}
</style>
</head>
<body><div style="text-align:center; margin-top:30px;">
  <img src="profilejpg.png"
       alt="Vansh Rai"
       style="width:130px;height:130px;border-radius:50%;object-fit:cover;">
  <h2>Vansh Rai</h2>
</div><a href="https://www.instagram.com/vansh.__0x/" target="_blank"
   style="text-decoration:none; color:inherit;">
  <div style="
    max-width:350px;
    margin:40px auto;
    padding:25px;
    text-align:center;
    background:#151521;
    border:1px solid #333;
    border-radius:20px;
    cursor:pointer;
  ">
    <div style="
      width:100px;
      height:100px;
      margin:auto;
      border-radius:50%;
      background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:45px;
    "><img src="profilejpg.png" alt="Vansh Rai"
style="width:180px;height:180px;border-radius:50%;object-fit:cover;"></div>

    <h2 style="margin:15px 0 5px;">Vansh Rai</h2>
    <p style="margin:0;color:#aaa;">@vansh.__0x</p>
    <p style="margin-top:15px;"
  </div>
</a>
<header>
  <div class="logo">Vansh <span>Rai</span></div>
  <nav><a href="#home">Home</a><a href="#prompts">Prompts</a></nav>
</header>

<section class="hero" id="home">
  <h1>AI Photo <span>Prompts</span></h1>
  <p>Ready-made prompts for realistic, cinematic and Instagram-style AI photos. Choose a category and copy your favorite prompt.</p>
</section>

<main class="container" id="prompts">
  <div class="categories">
    <div class="cat active" onclick="filterPrompts('all',this)">✨<b>All Prompts</b></div>
    <div class="cat" onclick="filterPrompts('portrait',this)">👤<b>Portrait</b></div>
    <div class="cat" onclick="filterPrompts('cinematic',this)">🎬<b>Cinematic</b></div>
    <div class="cat" onclick="filterPrompts('dslr',this)">📸<b>DSLR</b></div>
    <div class="cat" onclick="filterPrompts('travel',this)">🏨<b>Travel</b></div>
    <div class="cat" onclick="filterPrompts('instagram',this)">📱<b>Instagram</b></div>
  </div>

  <div id="promptList"></div>
</main>

<footer>© 2026 Vansh Rai • AI Photo Prompts</footer>

<script>
const prompts=[
{cat:'portrait',title:'Realistic Portrait',text:'A highly realistic portrait of a young Indian man, natural skin texture, detailed facial features, stylish black hair, soft daylight, shallow depth of field, professional photography, ultra-detailed, realistic DSLR quality.'},
{cat:'cinematic',title:'Cinematic Look',text:'A cinematic portrait of a young Indian man standing confidently in an urban environment, dramatic soft lighting, natural skin texture, rich atmosphere, shallow depth of field, cinematic color grading, realistic photography.'},
{cat:'dslr',title:'DSLR HD Photo',text:'A highly realistic DSLR photograph of a young Indian man, sharp facial details, natural skin texture, professional composition, 85mm lens look, soft background bokeh, realistic lighting, high detail, photorealistic.'},
{cat:'travel',title:'Luxury Hotel',text:'A realistic luxury hotel portrait of a young Indian man relaxing in an elegant modern room, warm ambient lighting, premium interior, natural expression, detailed skin texture, shallow depth of field, professional DSLR photography.'},
{cat:'instagram',title:'Instagram Style',text:'A stylish Instagram portrait of a young Indian man, trendy casual outfit, confident relaxed expression, clean composition, natural outdoor light, blurred background, realistic skin texture, premium social-media photography.'}
];

function render(list=prompts){
 const box=document.getElementById('promptList');
 box.innerHTML=list.map((p,i)=>`
 <div class="prompt-card">
  <div class="prompt-title"><h3>${p.title}</h3><span class="tag">${p.cat}</span></div>
  <div class="prompt">${p.text}</div>
  <button onclick="copyPrompt(this,${i})">📋 Copy Prompt</button>
 </div>`).join('');
}
function copyPrompt(btn,i){
 navigator.clipboard.writeText(prompts[i].text);
 btn.textContent='✓ Copied';
 btn.classList.add('copied');
 setTimeout(()=>{btn.textContent='📋 Copy Prompt';btn.classList.remove('copied')},1500);
}
function filterPrompts(cat,el){
 document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');
 render(cat==='all'?prompts:prompts.filter(p=>p.cat===cat));
}
render();
</script>
</body>
