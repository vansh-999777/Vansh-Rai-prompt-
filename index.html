<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vansh Rai | Instagram</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    }

    .card {
      width: 310px;
      padding: 30px 20px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 25px #0003;
    }

    .profile-link {
      display: inline-block;
    }

    .profile-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #e1306c;
      padding: 3px;
    }

    h2 {
      margin-bottom: 8px;
      color: #222;
    }

    .username {
      color: #777;
      margin-top: 0;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      border-radius: 25px;
      background: linear-gradient(45deg, #833ab4, #fd1d1d, #fcb045);
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- Photo par click karne se Instagram khulega -->
    <a class="profile-link"
       href="https://www.instagram.com/vansh.__0x/"
       target="_blank"
       rel="noopener noreferrer">

      <img
        class="profile-photo"
        src="https://placehold.co/300x300/eeeeee/333333?text=Your+Photo"
        alt="Vansh Rai Profile Photo">

    </a>

    <h2>Vansh Rai</h2>
    <p class="username">@vansh.__0x</p>
    <p>✨ Welcome to my profile ✨</p>

    <a class="button"
       href="https://www.instagram.com/vansh.__0x/"
       target="_blank"
       rel="noopener noreferrer">
      📸 Open Instagram
    </a>

  </div>

</body>
                   </html>
